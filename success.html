<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent Successfully | Mike Frontiero</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --navy: #0b1829;
            --navy-mid: #162236;
            --blue-accent: #2563eb;
            --gold: #c9a96e;
            --slate-text: #475569;
        }

        body { 
            font-family: 'DM Sans', sans-serif; 
            background: #f8f7f4;
        }

        .font-display { 
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        .success-bg { 
            background: linear-gradient(150deg, var(--navy) 0%, #0d2240 55%, #0b1829 100%);
            position: relative;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .success-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 60% 50% at 70% 50%, rgba(37,99,235,0.12) 0%, transparent 70%),
                        radial-gradient(ellipse 40% 60% at 20% 80%, rgba(201,169,110,0.07) 0%, transparent 60%);
        }

        .check-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.1);
            border: 3px solid rgba(34, 197, 94, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            animation: scaleIn 0.5s ease-out;
        }

        .check-icon {
            font-size: 60px;
            color: #86efac;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-primary {
            background: var(--gold);
            color: var(--navy);
            padding: 16px 48px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        
        .btn-primary:hover {
            background: #d4b57d;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -5px rgba(201, 169, 110, 0.4);
        }

        .btn-secondary {
            color: var(--gold);
            padding: 16px 32px;
            border: 2px solid var(--gold);
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        
        .btn-secondary:hover {
            background: rgba(201, 169, 110, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="success-bg text-white">
        <div class="max-w-2xl mx-auto px-6 text-center relative z-10">
            
            <!-- Success Icon -->
            <div class="check-circle">
                <i class="fas fa-check check-icon"></i>
            </div>

            <!-- Success Message -->
            <div class="fade-in">
                <h1 class="font-display text-5xl md:text-6xl mb-6 font-light tracking-tight">
                    Message Received
                </h1>
                <p class="text-slate-300 text-xl mb-4 font-light leading-relaxed">
                    Thank you for reaching out!
                </p>
                <p class="text-slate-400 text-lg mb-12 font-light leading-relaxed max-w-lg mx-auto">
                    I've received your message and will get back to you within 24-48 hours. I look forward to our conversation.
                </p>

                <!-- Action Buttons -->
                <div class="flex flex-wrap justify-center gap-4 mb-8">
                    <a href="index.html" class="btn-primary">
                        <i class="fas fa-home"></i>
                        Back to Home
                    </a>
                    <a href="https://www.linkedin.com/in/mfrontiero/" target="_blank" class="btn-secondary">
                        <i class="fab fa-linkedin"></i>
                        Connect on LinkedIn
                    </a>
                </div>

                <!-- Additional Info -->
                <div class="mt-16 pt-8 border-t border-slate-700">
                    <p class="text-slate-500 text-sm">
                        In the meantime, feel free to download my 
                        <a href="https://docs.google.com/document/d/1VsAF-1Qria3O6KH05YgOrlzVuRz5WJC2VFgDr7uITtw/export?format=pdf" 
                           target="_blank"
                           class="text-gold hover:text-white transition-colors underline underline-offset-4"
                           style="color: var(--gold);">
                            CV
                        </a>
                    </p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
