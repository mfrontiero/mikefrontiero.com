    <style>
        :root {
            --navy: #0b1829;
            --navy-mid: #162236;
            --blue-accent: #2563eb;
            --gold: #c9a96e;
            --slate-text: #475569;
        }

        body { 
            font-family: 'DM Sans', sans-serif; 
            background: #f8f7f4;
        }

        .font-display { 
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        /* ─── NAV ─── */
        .sticky-nav { 
            position: sticky; top: 0; z-index: 50; 
            backdrop-filter: blur(16px); 
            background-color: rgba(11, 24, 41, 0.97);
            border-bottom: 1px solid rgba(201,169,110,0.15);
        }

        /* ─── HERO ─── */
        .hero-bg { 
            background: linear-gradient(150deg, var(--navy) 0%, #0d2240 55%, #0b1829 100%);
            position: relative;
            overflow: hidden;
        }
        .hero-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 60% 50% at 70% 50%, rgba(37,99,235,0.12) 0%, transparent 70%),
                        radial-gradient(ellipse 40% 60% at 20% 80%, rgba(201,169,110,0.07) 0%, transparent 60%);
        }
        .hero-bg::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
            opacity: 0.4;
        }

        /* ─── SECTION HEADINGS ─── */
        .section-heading { 
            position: relative; 
            display: inline-block; 
            padding-bottom: 14px; 
        }
        .section-heading::after { 
            content: ''; 
            position: absolute; 
            left: 0; bottom: 0; 
            width: 36px; height: 2px; 
            background: var(--gold);
            border-radius: 2px;
        }
       
        .section-heading.centered::after {
            left: 50%;
            transform: translateX(-50%);
        }

        /* ─── CARDS ─── */
      
        .card-hover { 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
        }
        .card-hover:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.12);
        }

        /* ─── STATS ─── */
        .stat-number {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 300;
            line-height: 1;
            color: var(--navy);
        }

        /* ─── TIMELINE ─── */
        .timeline-dot-active {
            width: 14px; height: 14px;
            background: var(--blue-accent);
            border: 2px solid white;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.25);
            border-radius: 50%;
        }
        .timeline-dot-inactive {
            width: 14px; height: 14px;
            background: #94a3b8;
            border: 2px solid white;
            border-radius: 50%;
        }

        /* ─── TESTIMONIALS ─── */
        .testimonial-card {
            border-left: 3px solid var(--gold);
        }

        /* ─── MOBILE MENU ─── */
        #mobile-menu {
            display: none;
        }
        #mobile-menu.open {
            display: flex;
        }

        /* ─── FADE-IN ANIMATIONS ─── */
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* stagger delays */
        .delay-100 { transition-delay: 0.1s; }
        .delay-200 { transition-delay: 0.2s; }
        .delay-300 { transition-delay: 0.3s; }
        .delay-400 { transition-delay: 0.4s; }

        /* ─── EXPERTISE ICONS ─── */
        .tool-chip {
            display: inline-block;
            background: #eef2ff;
            color: #3730a3;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 4px 12px;
            margin: 3px 2px;
        }

        /* ─── FOOTER ─── */
        .footer-bg {
            background: var(--navy);
            position: relative;
            overflow: hidden;
        }
        .footer-bg::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
            opacity: 0.4;
        }

        @media (max-width: 768px) {
            .hero-h1 { font-size: 3rem; }
        }
    </style>
